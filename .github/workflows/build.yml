name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (XiaoZhi CUBE 1.54" TFT 4G)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Show binary size
        shell: bash
        run: ls -l build/claude-desktop-buddy.bin
